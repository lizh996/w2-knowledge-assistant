<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 变压器 标准证据驾驶舱</title>
  <style>
    :root {
      --bg: #fbfaf9;
      --bg-2: #f6f1ff;
      --panel: rgba(255,255,255,.96);
      --line: #e8e6e3;
      --line-strong: #ddd6fe;
      --text: #1a1a1a;
      --muted: #6b7280;
      --accent: #6c4bf4;
      --cyan: #8b5cf6;
      --ok: #22c55e;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(108,75,244,.09), transparent 22%),
        radial-gradient(circle at 82% 12%, rgba(139,92,246,.08), transparent 18%),
        linear-gradient(180deg, var(--bg), var(--bg-2) 68%, #fbfaf9);
    }
    .card {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid rgba(232,230,227,.9);
      border-radius: 20px;
      box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 20px 50px rgba(15,23,42,.08);
      padding: 30px;
      backdrop-filter: blur(18px);
    }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      margin-bottom: 20px;
      box-shadow: 0 12px 24px rgba(108,75,244,.22);
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; color: #111827; }
    .sub { margin: 8px 0 24px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    label { display: block; color: #374151; font-size: 13px; margin: 14px 0 8px; font-weight: 700; }
    input {
      width: 100%;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 13px 16px;
      font: inherit;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease, transform .18s ease;
    }
    input:hover { border-color: #d8cff8; background: #fbfaff; }
    input:focus {
      outline: none;
      border-color: rgba(108,75,244,.35);
      box-shadow: 0 0 0 4px rgba(108,75,244,.12);
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      padding: 13px 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      cursor: pointer;
      font-weight: 800;
      font: inherit;
      box-shadow: 0 12px 28px rgba(108,75,244,.18);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease, opacity .16s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: saturate(1.05);
      box-shadow: 0 16px 34px rgba(108,75,244,.24);
    }
    button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 8px 18px rgba(108,75,244,.16);
    }
    button:disabled { cursor: not-allowed; opacity: .55; box-shadow: none; }
    .error {
      display: none;
      margin-top: 12px;
      color: #991b1b;
      background: rgba(254,226,226,.92);
      border: 1px solid rgba(248,113,113,.22);
      border-radius: 14px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .hint {
      margin-top: 16px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(34,197,94,.16);
      background: rgba(240,253,244,.92);
      color: #14532d;
      font-size: 12px;
      line-height: 1.8;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 18px;
    }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ok); box-shadow: 0 0 0 5px rgba(34,197,94,.12); }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .card { padding: 22px; border-radius: 18px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <section class="card">
    <div class="mark">变压器</div>
    <h1>变压器 知识库问答</h1>
    <p class="sub">工业标准证据驾驶舱 · 登录后查看答案、引用页码与检索链路</p>

    <label for="username">用户名</label>
    <input id="username" type="text" placeholder="admin 或 user" autocomplete="username">

    <label for="password">密码</label>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">

    <button id="loginBtn" onclick="doLogin()">登录</button>
    <div class="error" id="error"></div>

    <div class="hint">
      演示账号：admin / admin123（管理员）<br>
      演示账号：user / user123（普通用户）
    </div>
    <div class="status"><span class="dot"></span>知识库在线</div>
  </section>

  <script>
    const API_BASE = localStorage.getItem('api_base') || location.origin;
    const loginNotice = sessionStorage.getItem('login_notice');
    if (loginNotice) {
      const error = document.getElementById('error');
      error.textContent = loginNotice;
      error.style.display = 'block';
      sessionStorage.removeItem('login_notice');
    }

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('error');

      if (!username || !password) {
        error.textContent = '请输入用户名和密码';
        error.style.display = 'block';
        return;
      }
      btn.disabled = true;
      error.style.display = 'none';

      try {
        const resp = await fetch(API_BASE + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (resp.status === 401) {
          error.textContent = '用户名或密码错误';
          error.style.display = 'block';
          return;
        }
        if (!resp.ok) throw new Error(await readErrorDetail(resp));

        const data = await resp.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        location.href = data.role === 'admin' ? '/admin' : '/';
      } catch (e) {
        error.textContent = requestErrorMessage(e);
        error.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    }

    async function readErrorDetail(resp) {
      let detail = '请求失败 ' + resp.status;
      try {
        const data = await resp.json();
        detail = data.detail || data.message || detail;
      } catch (e) {}
      return detail;
    }

    function requestErrorMessage(error) {
      if (error && error.name === 'TypeError') {
        return '无法连接后端服务，请确认本地服务已启动。';
      }
      return (error && error.message) ? error.message : '请求失败，请稍后重试。';
    }

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
